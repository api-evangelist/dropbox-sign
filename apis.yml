aid: dropbox-sign
name: Dropbox Sign
description: Dropbox Sign (formerly HelloSign) is an eSignature platform that lets
  developers and businesses embed legally binding electronic signature workflows into
  their applications and websites. The product supports embedded signing and requesting,
  reusable templates, custom signer fields, branded signing flows, audit trails, and
  tamper-proof document delivery. The Dropbox Sign API is documented with an official
  OpenAPI specification and authenticated via HTTP Basic Auth with an API key or OAuth
  2.0 Bearer tokens.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- eSignature
- Electronic Signature
- Document Signing
- Workflow Automation
- Documents
url: https://raw.githubusercontent.com/api-evangelist/dropbox-sign/refs/heads/main/apis.yml
