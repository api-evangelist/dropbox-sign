apis:
- aid: dropbox-sign:rest-api
  name: Dropbox Sign REST API
  description: Versioned REST API (v3) for sending signature requests, managing templates,
    teams, accounts, embedded signing/requesting flows, OAuth apps, and reports. Authentication
    is HTTP Basic Auth with an API key or OAuth 2.0 Bearer tokens; the API ships with
    an officially maintained OpenAPI specification used to generate SDKs and reference
    docs.
  humanURL: https://developers.hellosign.com/api/api-reference-welcome
  baseURL: https://api.hellosign.com/v3
